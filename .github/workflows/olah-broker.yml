name: Olah data broker

on:
  push:
    paths:
      - "docs/data/broker/hari/**"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: data-repo
  cancel-in-progress: false

jobs:
  olah:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Olah
        run: python scripts/olah_broker.py
      - name: Simpan
        run: |
          git config user.name "bot-analisis"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data
          if git diff --cached --quiet; then echo "Tidak ada perubahan."; else
            git commit -m "Olah data broker"
            git pull --rebase origin main
            git push
          fi
