name: Analisis harian

on:
  schedule:
    # 10:30 UTC = 17:30 WIB, Senin–Jumat (setelah bursa tutup)
    - cron: "30 10 * * 1-5"
  workflow_dispatch: {}   # tombol "Run workflow" untuk menjalankan manual

permissions:
  contents: write

concurrency:
  group: analisis-harian
  cancel-in-progress: false

jobs:
  analisis:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Pasang pustaka
        run: pip install -r requirements.txt

      - name: Ambil data dan analisis
        run: python scripts/jalankan.py

      - name: Simpan hasil ke repositori
        run: |
          git config user.name "bot-analisis"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data
          if git diff --cached --quiet; then
            echo "Tidak ada data baru."
          else
            git commit -m "Data harian $(TZ=Asia/Jakarta date +'%Y-%m-%d')"
            git push
          fi
