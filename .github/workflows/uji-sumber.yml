name: Uji sumber data
on: workflow_dispatch
jobs:
  uji:
    runs-on: ubuntu-latest
    steps:
      - run: |
          D=$(TZ=Asia/Jakarta date -d "yesterday" +%m/%d/%Y)
          for u in \
            "https://www.indopremier.com/module/saham/include/data-brokersummary.php?code=BBCA&start=11/26/2026&end=11/26/2026&fd=all&board=all" \
            "https://www.indopremier.com/module/saham/include/corporateaction.php?code=BBCA" \
            "https://www.indopremier.com/module/saham/include/ma-marketstatistic.php" \
            "https://github.com/fzn0x/idx/releases/download/ownership-data/index.json" ; do
            echo "=== $u"
            curl -sSL -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) Chrome/124" -o out.html -w "status %{http_code} size %{size_download}\n" "$u"
            head -c 1500 out.html | sed 's/<[^>]*>/ /g' | tr -s ' \n' | head -c 800; echo
          done
