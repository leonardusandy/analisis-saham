name: Berita

on:
  schedule:
    # setiap 2 jam, 06.00–20.00 WIB (23:00–13:00 UTC)
    - cron: "0 23,1,3,5,7,9,11,13 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: data-repo
  cancel-in-progress: false

jobs:
  berita:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Pasang pustaka
        run: pip install feedparser
      - name: Ambil berita
        run: python scripts/berita.py
      - name: Simpan
        run: |
          git config user.name "bot-analisis"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/berita.json
          if git diff --cached --quiet; then
            echo "Tidak ada berita baru."
          else
            git commit -m "Berita $(TZ=Asia/Jakarta date +'%Y-%m-%d %H:%M')"
            git pull --rebase origin main
            git push
          fi
