name: Terbitkan web

on:
  schedule:
    # Menit dibuat tidak bulat: jadwal GitHub di awal jam paling sering tertunda/terlewat.
    - cron: "37 10 * * 1-5"                   # 17.37 WIB hari bursa: semua data
    - cron: "13 23,1,3,5,7,9,11,13 * * *"     # tiap 2 jam 06.13–20.13 WIB: berita (+ susulan bila data tertinggal)
  push:
    branches: [main]
    paths:
      - "docs/index.html"
      - "docs/data/broker/hari/**"            # kiriman dari laptop
  workflow_dispatch:
    inputs:
      mode:
        description: "harian (semua), berita, atau broker"
        default: harian

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: terbitkan
  cancel-in-progress: false

jobs:
  terbitkan:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    env:
      DATA_KELUAR: _site/data
      # Opsional: aktifkan analisis berita dengan AI Claude (rahasia repositori ANTHROPIC_API_KEY)
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.mode || github.event_name == 'push' && 'broker' || github.event.schedule == '37 10 * * 1-5' && 'harian' || 'berita' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      # Data hasil olahan disimpan di cache Actions (bukan di riwayat repositori)
      - name: Pulihkan data sebelumnya
        uses: actions/cache/restore@v4
        with:
          path: _site/data
          key: data-${{ github.run_id }}
          restore-keys: data-

      - name: Pasang pustaka
        run: pip install -r requirements.txt

      - name: Bangun data (${{ env.MODE }})
        env:
          SANDI_WEB: ${{ secrets.SANDI_WEB || secrets.LEONARDUSANDY }}
        run: python scripts/bangun.py "$MODE"

      - name: Siapkan halaman
        run: |
          cp docs/index.html _site/index.html
          touch _site/.nojekyll
          du -sh _site

      - name: Simpan data untuk berikutnya
        uses: actions/cache/save@v4
        with:
          path: _site/data
          key: data-${{ github.run_id }}

      # Data di cache tetap utuh; yang diterbitkan adalah salinan terenkripsi.
      - name: Kunci data dengan sandi web
        env:
          SANDI_WEB: ${{ secrets.SANDI_WEB || secrets.LEONARDUSANDY }}
        run: python scripts/enkripsi.py _site _terbit

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _terbit

      - id: deploy
        uses: actions/deploy-pages@v4
